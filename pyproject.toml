[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "care-second-brain"
version = "0.1.0"
description = "Synthetic-only oncology documentation and history plugin"
requires-python = ">=3.11"
dependencies = ["Django>=5.2,<5.3", "cryptography>=45,<47", "Pillow>=11,<13", "pypdf>=6,<7"]
[tool.setuptools.packages.find]
where = ["backend"]
include = ["second_brain*"]
